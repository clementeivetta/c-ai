name: Deploy to GitHub Pages

on:
  # Activar cada vez que haya un "push" a la rama main
  push:
    branches: [ main ]
  # Permite ejecutar este flujo de trabajo manualmente si lo necesitas
  workflow_dispatch:

# Permisos necesarios para que GitHub Actions pueda publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # Este es el comando que ejecuta Astro para construir el sitio
        with:
            path: .
            node-version: 20
            package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4